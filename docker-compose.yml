version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sapps-postgres
    restart: always
    environment:
      POSTGRES_USER: sapps_user
      POSTGRES_PASSWORD: sapps_password
      POSTGRES_DB: sapps_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapps_user -d sapps_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sapps-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://sapps_user:sapps_password@db:5432/sapps_db
      - SECRET_KEY=sapps-super-secret-production-grade-key-2024-change-in-prod
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost,http://localhost:5173,http://localhost:80
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sapps-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:

